name: Background Coding Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: background-coding-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure Git
        run: |
          git config user.name "background-coding-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Codex
        run: |
          npm install --global @openai/codex
          codex --version

      - name: Find agent-ready issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          gh issue list \
            --state open \
            --label agent-ready \
            --limit 1 \
            --json number,title,body > issue.json

          ISSUE_NUMBER="$(jq -r '.[0].number // empty' issue.json)"

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Run coding agent
        if: steps.issue.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          ISSUE_TITLE="$(jq -r '.[0].title' issue.json)"
          ISSUE_BODY="$(jq -r '.[0].body // ""' issue.json)"

          SAFE_TITLE="$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -cs 'a-z0-9' '-' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-50)"

          BRANCH="agent/issue-${ISSUE_NUMBER}-${SAFE_TITLE}"

          git switch -c "$BRANCH"

          codex exec \
            --sandbox workspace-write \
            "Work on GitHub issue #${ISSUE_NUMBER}.

            Title:
            ${ISSUE_TITLE}

            Description:
            ${ISSUE_BODY}

            Requirements:
            - Inspect the repository before editing.
            - Make the smallest correct change.
            - Add or update regression tests.
            - Run formatter, linter, type checker, and tests when available.
            - Never modify secrets, credentials, or production access.
            - Do not perform destructive operations.
            - Do not merge or deploy.
            - Commit the changes if checks pass.
            - If the issue is unsafe or unclear, stop and explain why."

          if git diff --quiet; then
            echo "No changes produced."
            exit 0
          fi

          git add -A
          git commit -m "agent: address issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "agent: ${ISSUE_TITLE}" \
            --body "Automated implementation for #${ISSUE_NUMBER}. Review the changes and CI results before merging."

          gh issue comment "$ISSUE_NUMBER" \
            --body "The background coding agent opened a pull request for this issue."

      - name: No work available
        if: steps.issue.outputs.found != 'true'
        run: echo "No open issue labeled agent-ready."
